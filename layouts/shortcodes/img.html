<figure{{ with .Get "class" }} class="{{.}}"{{ end }}>
  {{- partial "images/native.html" (dict "page" .Page "src" (.Get "src") "alt" (.Get "alt") "title" (.Get "title") "loading" (.Get "loading") "sizes" (.Get "sizes") "class" "img-fluid") -}}
  {{ with .Get "caption" }}<figcaption class="figure-caption">{{ . | safeHTML }}</figcaption>{{ end }}
</figure>
