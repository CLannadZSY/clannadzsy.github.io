# Deploy your Hyas site to GitHub Pages

name: GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm ci

      - name: Check for linting errors
        run: npm test

      - name: Build production website
        run: npm run build

      - name: Validate P0 SEO output
        run: |
          python3 tests/seo-sitemap.py public --base-url https://clannad.icu/
          python3 tests/seo-homepage.py public --base-url https://clannad.icu/

      - name: Validate blog descriptions
        run: python3 tests/seo-blog-descriptions.py public --base-url https://clannad.icu/

      - name: Validate published content
        run: python3 tests/seo-published-content.py public --base-url https://clannad.icu/

      - name: Validate independent tool pages
        run: python3 tests/seo-tools.py public --base-url https://clannad.icu/

      - name: Set up Node.js for browser utility tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test toolbox functions
        run: |
          node tests/loose-json.mjs
          node tests/curl-to-requests.mjs
          node tests/timestamp-converter.mjs
          node tests/password-generator.mjs
          node tests/naming-converter.mjs
          node tests/image-list.mjs

      - name: Copy CNAME file to public
        run: cp ./CNAME ./public

      - name: Copy ads txt to public
        run: cp ads.txt ./public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
